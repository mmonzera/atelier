name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: npm install

      - name: Build packages & web UI
        run: npm run build

      - name: Build & sign Tauri NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --workspace @atelier/desktop run build:release

      - name: Generate latest.json updater manifest
        shell: pwsh
        run: |
          $conf = Get-Content -Raw desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          $ver = $conf.version
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { "v$ver" }
          $nsisDir = "desktop/src-tauri/target/release/bundle/nsis"
          $exeName = "Atelier_${ver}_x64-setup.exe"
          $sig = (Get-Content -Raw "$nsisDir/$exeName.sig").Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$exeName"
          $manifest = @{
            version = $ver
            notes = "Atelier $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{ signature = $sig; url = $url }
              "windows-x86_64-nsis" = @{ signature = $sig; url = $url }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 "$nsisDir/latest.json"

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Atelier ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/Atelier_*_x64-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/Atelier_*_x64-setup.exe.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json
