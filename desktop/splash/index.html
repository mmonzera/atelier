<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Atelier</title>
<!-- Shown by the desktop shell until the local server is up; then the web app's start-up screen
     (web/src/components/BootLoader.tsx) takes over with the same look. No scripts, no network. -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;color:#9494a3;font:13px system-ui,-apple-system,"Segoe UI",sans-serif;
    background:radial-gradient(ellipse at 50% 42%,#16161d 0%,#0d0d11 62%)}
  .center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  .logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#f4f4f6;background:#15151b;border:1px solid #282833;
    box-shadow:0 0 0 6px rgba(216,190,146,.06),0 14px 40px rgba(0,0,0,.55);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{box-shadow:0 0 0 10px rgba(216,190,146,.1),0 14px 40px rgba(0,0,0,.55)}}
  .name{font-size:20px;font-weight:500;letter-spacing:.02em;color:#e4e4ea}
  .bar{position:relative;width:220px;height:4px;border-radius:9999px;overflow:hidden;background:#24242e}
  .bar span{position:absolute;top:0;bottom:0;width:38%;border-radius:9999px;background:linear-gradient(90deg,#8a6d3b,#d8be92 60%,#f4e2bd);animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{0%{left:-40%}100%{left:102%}}

  /* Bots lowered on gold cables, then swaying. */
  .hang{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;
    animation:sway var(--sway,3s) ease-in-out calc(var(--delay) + 1.1s) infinite alternate}
  .rope{width:2px;height:0;background:linear-gradient(to bottom,rgba(216,190,146,.15),#d8be92 40%,#c9a86a);box-shadow:0 0 6px rgba(216,190,146,.25);
    animation:lower 1.1s cubic-bezier(.3,.7,.4,1) var(--delay) both}
  .knot{width:7px;height:7px;margin:-2px 0 -3px;border-radius:9999px;background:#d8be92;box-shadow:0 0 8px rgba(216,190,146,.45)}
  @keyframes lower{0%{height:0}62%{height:calc(var(--len)*1.09)}78%{height:calc(var(--len)*.96)}90%{height:calc(var(--len)*1.02)}100%{height:var(--len)}}
  @keyframes sway{from{transform:rotate(-3.2deg)}to{transform:rotate(3.2deg)}}

  /* A simple bot: soft coloured body with two eyes (the app shows the full 3D ones). */
  .bot{display:block;position:relative;width:var(--s);height:var(--s);border-radius:46%;
    background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 60%,#000));
    box-shadow:inset 0 -6px 14px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.4)}
  .bot.hex{border-radius:28%}.bot.pill{height:calc(var(--s)*.72);border-radius:9999px}
  .bot::before,.bot::after{content:"";position:absolute;top:42%;width:13%;height:20%;border-radius:9999px;background:#f3ede2}
  .bot::before{left:31%}.bot::after{right:31%}

  /* Bots that drop in and bounce into a pile at the bottom. */
  .fall{position:absolute;animation:drop 1.25s var(--delay) both}
  @keyframes drop{
    0%{transform:translateY(-115vh);animation-timing-function:cubic-bezier(.55,0,1,.45)}
    58%{transform:translateY(0) rotate(var(--tilt));animation-timing-function:cubic-bezier(0,.55,.45,1)}
    72%{transform:translateY(-46px) rotate(calc(var(--tilt)*-.6));animation-timing-function:cubic-bezier(.55,0,1,.45)}
    84%{transform:translateY(0) rotate(var(--tilt));animation-timing-function:cubic-bezier(0,.55,.45,1)}
    92%{transform:translateY(-12px) rotate(var(--tilt));animation-timing-function:cubic-bezier(.55,0,1,.45)}
    100%{transform:translateY(0) rotate(var(--tilt))}}

  @media (prefers-reduced-motion:reduce){.hang,.rope,.logo,.bar span,.fall{animation:none}.rope{height:var(--len)}.bar span{left:0;width:60%}.fall{transform:rotate(var(--tilt))}}
</style>
</head>
<body>
  <div class="hang" style="left:9%;--len:30vh;--delay:.05s;--sway:2.6s"><span class="rope"></span><span class="knot"></span><span class="bot" style="--s:64px;--c:#9b67f7"></span></div>
  <div class="hang" style="left:22%;--len:14vh;--delay:.45s;--sway:3.1s"><span class="rope"></span><span class="knot"></span><span class="bot hex" style="--s:52px;--c:#f4bc2e"></span></div>
  <div class="hang" style="left:34%;--len:6vh;--delay:.9s;--sway:3.6s"><span class="rope"></span><span class="knot"></span><span class="bot pill" style="--s:44px;--c:#27b998"></span></div>
  <div class="hang" style="left:64%;--len:9vh;--delay:.7s;--sway:2.9s"><span class="rope"></span><span class="knot"></span><span class="bot" style="--s:46px;--c:#dc4fa8"></span></div>
  <div class="hang" style="left:77%;--len:24vh;--delay:.25s;--sway:3.4s"><span class="rope"></span><span class="knot"></span><span class="bot hex" style="--s:60px;--c:#f28c28"></span></div>
  <div class="hang" style="left:90%;--len:12vh;--delay:.6s;--sway:2.7s"><span class="rope"></span><span class="knot"></span><span class="bot" style="--s:50px;--c:#38c976"></span></div>

  <div class="fall" style="left:3%;bottom:-24px;--delay:1s;--tilt:-6deg"><span class="bot pill" style="--s:110px;--c:#ef4d42"></span></div>
  <div class="fall" style="left:15%;bottom:-18px;--delay:1.35s;--tilt:8deg"><span class="bot hex" style="--s:92px;--c:#38c976"></span></div>
  <div class="fall" style="left:27%;bottom:-28px;--delay:1.7s;--tilt:0deg"><span class="bot" style="--s:100px;--c:#9b67f7"></span></div>
  <div class="fall" style="left:62%;bottom:-22px;--delay:1.2s;--tilt:-4deg"><span class="bot hex" style="--s:96px;--c:#f4bc2e"></span></div>
  <div class="fall" style="left:74%;bottom:-16px;--delay:1.55s;--tilt:5deg"><span class="bot" style="--s:88px;--c:#dc4fa8"></span></div>
  <div class="fall" style="left:86%;bottom:-26px;--delay:1.9s;--tilt:-8deg"><span class="bot hex" style="--s:106px;--c:#f28c28"></span></div>

  <div class="center">
    <div class="logo"><svg width="34" height="26" viewBox="0 0 104 80" fill="currentColor" aria-label="Atelier"><path d="M3 76.5 36.9 12.5C40.3 6.2 45 3.5 51 3.5c6.3 0 11 3 14.2 9.1l15.4 28H62.7L51 19.1 19.6 76.5Z"/><path d="m31.3 76.5 12.6-23.6c2.7-5.1 7.4-7.5 13.1-7.5h26l16.9 31.1H82L73.6 61H56.5l-8.3 15.5Z"/></svg></div>
    <div class="name">Atelier</div>
    <div class="bar"><span></span></div>
    <div>Memulai Atelier…</div>
  </div>
</body>
</html>
