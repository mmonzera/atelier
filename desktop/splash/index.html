<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Atelier</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d11;color:#9494a3;font:13px system-ui,sans-serif}
  body{display:grid;place-items:center}
  .box{text-align:center}
  .logo{width:44px;height:44px;margin:0 auto 14px;border-radius:12px;background:#15151b;border:1px solid #282833;display:grid;place-items:center;color:#f4f4f6;font-weight:600;font-size:20px;animation:p 1.4s ease-in-out infinite}
  @keyframes p{50%{opacity:.45}}
</style>
</head>
<body><div class="box"><div class="logo">A</div>Memulai Atelier…</div></body>
</html>
