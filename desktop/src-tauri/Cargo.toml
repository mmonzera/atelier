[package]
name = "atelier-desktop"
version = "0.1.11"
description = "Atelier desktop shell (Tauri)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde_json = "1"
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSUUID", "NSValue", "NSObject"] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFString", "CFDictionary", "CFArray", "CFNumber"] }
objc2-core-audio = { version = "0.3", features = ["AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
